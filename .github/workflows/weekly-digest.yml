name: Weekly Digest Email

on:
  schedule:
    # Every Monday at 7:00 UTC = 9:00 Paris
    - cron: "0 7 * * 1"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly digest
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.BACKEND_URL }}/api/email/trigger-weekly-digest" \
            -H "Content-Type: application/json" \
            -H "X-Internal-Secret: ${{ secrets.ALERTS_CHECK_SECRET }}" \
            --max-time 120)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Weekly digest trigger returned HTTP $STATUS"
          fi
